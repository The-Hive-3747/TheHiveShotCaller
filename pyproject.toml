[project]
name = "hiveshot"
version = "0.1.0"
description = "Camera-based shot analytics for the FTC BIOBUZZ HIVE"
requires-python = ">=3.12"
dependencies = [
  "opencv-contrib-python",
  "numpy",
  "scipy",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "websockets",
  "aiofiles",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires physical cameras or network; skipped unless HIVESHOT_LIVE=1", "build: requires a packaged build in dist/; skipped otherwise", "timing: asserts wall-clock lag or zero dropped frames; the build gate runs these in a separate serialized pass"]
addopts = "-q"

<text x='30.0' y='1201.0' font-size='14' fill='#333' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Floor cross A: from field centre, 10 in toward RED and 34 in toward the audience.   Floor cross B: 11 in toward RED and 39 in toward the audience.</text>
<text x='30.0' y='1223.0' font-size='14' fill='#333' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Grey dots: tripod feet. One leg points straight away from the wall; no foot touches the wall. Dashed lines: where each camera looks. Keep people out of them.</text>
<text x='30.0' y='1245.0' font-size='14' fill='#333' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Black bars: the four printed tags. 100 and 101 lie on the slanted logo panel; 102 and 103 stand at the HIVE's base corners on the audience side.</text>

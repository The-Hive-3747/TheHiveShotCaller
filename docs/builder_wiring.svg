<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1240 610' width='1240' height='610'>
<rect width='1240' height='610' fill='#ffffff'/>
<text x='30.0' y='42.0' font-size='26' fill='#111111' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >How to wire it: one cable run per camera, straight into the PC</text>
<text x='30.0' y='68.0' font-size='15' fill='#111111' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >USB carries both the picture and the power. The cameras have no power brick and no batteries.</text>
<rect x='960' y='105' width='250' height='330' rx='12' fill='#fff6d8' stroke='#8a6d00' stroke-width='3'/>
<text x='1085.0' y='262.0' font-size='30' fill='#5c4800' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >PC</text>
<text x='1085.0' y='288.0' font-size='14' fill='#5c4800' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >running HiveShotTracker</text>
<text x='1085.0' y='310.0' font-size='14' fill='#5c4800' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >laptop on its charger</text>
<rect x='30' y='105' width='230' height='110' rx='10' fill='#ffffff' stroke='#1a5fd0' stroke-width='3'/><text x='145.0' y='135.0' font-size='18' fill='#1a5fd0' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >CAMERA A  =  cam0</text><text x='145.0' y='157.0' font-size='14' fill='#1a5fd0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Arducam on its bracket</text><text x='145.0' y='179.0' font-size='14' fill='#1a5fd0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >and tripod</text>
<line x1='260.0' y1='160.0' x2='430.0' y2='160.0' stroke='#1a5fd0' stroke-width='5' />
<text x='345.0' y='146.0' font-size='13' fill='#1a5fd0' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >camera's own USB cable</text>
<text x='345.0' y='184.0' font-size='13' fill='#1a5fd0' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >(about 3 ft)</text>
<rect x='430' y='146' width='34' height='28' rx='4' fill='#1a5fd0'/>
<rect x='468' y='142' width='44' height='36' rx='4' fill='#ffffff' stroke='#1a5fd0' stroke-width='4'/>
<text x='471.0' y='210.0' font-size='13' fill='#666666' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >socket end of the</text>
<text x='471.0' y='227.0' font-size='13' fill='#666666' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >extension: camera side</text>
<line x1='512.0' y1='160.0' x2='900.0' y2='160.0' stroke='#1a5fd0' stroke-width='9' stroke-linecap='round'/>
<text x='706.0' y='142.0' font-size='15' fill='#1a5fd0' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >active USB 3.0 extension, 16.4 ft</text>
<text x='706.0' y='188.0' font-size='13' fill='#666666' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >along the floor outside the wall, taped down</text>
<rect x='900' y='146' width='44' height='28' rx='4' fill='#1a5fd0'/>
<rect x='960' y='138' width='30' height='44' fill='#2a6fdb' stroke='#12408a' stroke-width='2'/>
<text x='1000.0' y='158.0' font-size='16' fill='#5c4800' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >USB port 1</text>
<text x='1000.0' y='178.0' font-size='13' fill='#5c4800' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >blue = USB 3.0</text>
<text x='944.0' y='210.0' font-size='13' fill='#666666' text-anchor='end' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >plug end: PC side</text>
<rect x='30' y='315' width='230' height='110' rx='10' fill='#ffffff' stroke='#1e8a2e' stroke-width='3'/><text x='145.0' y='345.0' font-size='18' fill='#1e8a2e' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >CAMERA B  =  cam1</text><text x='145.0' y='367.0' font-size='14' fill='#1e8a2e' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Arducam on its bracket</text><text x='145.0' y='389.0' font-size='14' fill='#1e8a2e' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >and tripod</text>
<line x1='260.0' y1='370.0' x2='430.0' y2='370.0' stroke='#1e8a2e' stroke-width='5' />
<text x='345.0' y='356.0' font-size='13' fill='#1e8a2e' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >camera's own USB cable</text>
<text x='345.0' y='394.0' font-size='13' fill='#1e8a2e' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >(about 3 ft)</text>
<rect x='430' y='356' width='34' height='28' rx='4' fill='#1e8a2e'/>
<rect x='468' y='352' width='44' height='36' rx='4' fill='#ffffff' stroke='#1e8a2e' stroke-width='4'/>
<text x='471.0' y='420.0' font-size='13' fill='#666666' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >socket end of the</text>
<text x='471.0' y='437.0' font-size='13' fill='#666666' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >extension: camera side</text>
<line x1='512.0' y1='370.0' x2='900.0' y2='370.0' stroke='#1e8a2e' stroke-width='9' stroke-linecap='round'/>
<text x='706.0' y='352.0' font-size='15' fill='#1e8a2e' text-anchor='middle' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >active USB 3.0 extension, 16.4 ft</text>
<text x='706.0' y='398.0' font-size='13' fill='#666666' text-anchor='middle' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >along the floor outside the wall, taped down</text>
<rect x='900' y='356' width='44' height='28' rx='4' fill='#1e8a2e'/>
<rect x='960' y='348' width='30' height='44' fill='#2a6fdb' stroke='#12408a' stroke-width='2'/>
<text x='1000.0' y='368.0' font-size='16' fill='#5c4800' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >USB port 2</text>
<text x='1000.0' y='388.0' font-size='13' fill='#5c4800' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >blue = USB 3.0</text>
<text x='944.0' y='420.0' font-size='13' fill='#666666' text-anchor='end' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >plug end: PC side</text>
<text x='34.0' y='482.0' font-size='16' fill='#111111' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >1.</text>
<text x='62.0' y='482.0' font-size='16' fill='#111111' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Each camera gets its OWN port on the PC. Never plug both cameras into one hub, dock or splitter: the frame rate collapses.</text>
<text x='34.0' y='510.0' font-size='16' fill='#111111' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >2.</text>
<text x='62.0' y='510.0' font-size='16' fill='#111111' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >The extension works in one direction only: plug end into the PC, socket end toward the camera.</text>
<text x='34.0' y='538.0' font-size='16' fill='#111111' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >3.</text>
<text x='62.0' y='538.0' font-size='16' fill='#111111' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Not enough USB-A ports on the laptop? Use one USB-C adapter per camera, each in a different USB-C port.</text>
<text x='34.0' y='566.0' font-size='16' fill='#111111' text-anchor='start' font-weight='bold' font-family='Segoe UI, Arial, Helvetica, sans-serif' >4.</text>
<text x='62.0' y='566.0' font-size='16' fill='#111111' text-anchor='start' font-weight='normal' font-family='Segoe UI, Arial, Helvetica, sans-serif' >Label both ends of each cable A or B with tape. In the app, camera A must show up as cam0 and camera B as cam1.</text>
</svg>